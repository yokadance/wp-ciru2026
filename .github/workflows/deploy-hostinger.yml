name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
    paths:
      - 'astra-ciru-child/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:  # Permite deploy manual desde GitHub UI

jobs:
  deploy:
    name: Deploy child theme via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install sshpass
        run: sudo apt-get update && sudo apt-get install -y sshpass

      - name: Deploy via SFTP
        env:
          HOST: ${{ secrets.FTP_SERVER }}
          USER: ${{ secrets.FTP_USERNAME }}
          PASS: ${{ secrets.FTP_PASSWORD }}
        run: |
          cd astra-ciru-child
          sshpass -p "$PASS" sftp -o StrictHostKeyChecking=no -o Port=65002 $USER@$HOST <<EOF
          cd /domains/congresoscu.org/public_html/wp-content/themes/astra-ciru-child
          put -r *
          bye
          EOF

      - name: Deployment summary
        run: |
          echo "✅ Child theme deployed to Hostinger"
          echo "🌐 Site: https://congresoscu.org"
