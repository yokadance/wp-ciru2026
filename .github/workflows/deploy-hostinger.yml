name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
    paths:
      - 'astra-ciru-child/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:  # Permite deploy manual desde GitHub UI

jobs:
  deploy:
    name: Deploy child theme via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p 65002 ${{ secrets.FTP_SERVER }} >> ~/.ssh/known_hosts

      - name: Deploy via rsync over SSH
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p 65002 -o StrictHostKeyChecking=no" \
            astra-ciru-child/ \
            ${{ secrets.FTP_USERNAME }}@${{ secrets.FTP_SERVER }}:/domains/congresoscu.org/public_html/wp-content/themes/astra-ciru-child/

      - name: Deployment summary
        run: |
          echo "✅ Child theme deployed to Hostinger"
          echo "🌐 Site: https://congresoscu.org"
