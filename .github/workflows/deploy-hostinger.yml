name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
    paths:
      - 'astra-ciru-child/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:  # Permite deploy manual desde GitHub UI

jobs:
  deploy:
    name: Deploy child theme via SFTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftp
          port: 21
          local-dir: ./astra-ciru-child/
          server-dir: /public_html/wp-content/themes/astra-ciru-child/
          dangerous-clean-slate: false
          state-name: .ftp-deploy-sync-state-${{ github.sha }}.json  # Nuevo estado cada commit
          log-level: verbose  # Ver qué archivos se suben
          exclude: |
            **/.git*
            **/.DS_Store
            **/node_modules/**
            **/.gitignore
            **/README.md

      - name: Clear server-side cache
        run: |
          echo "Clearing OPcache and WP cache..."
          curl -s "https://congresoscu.org/wp-content/themes/astra-ciru-child/opcache-clear.php?token=${{ secrets.CACHE_CLEAR_TOKEN }}"
          sleep 2

      - name: Deployment summary
        run: |
          echo "✅ Child theme deployed to Hostinger"
          echo "🔄 Server cache cleared"
          echo "🌐 Site: https://congresoscu.org"
