name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
    paths:
      - 'astra-ciru-child/**'
      - '.github/workflows/deploy-hostinger.yml'
  workflow_dispatch:  # Permite deploy manual desde GitHub UI

jobs:
  deploy:
    name: Deploy child theme via FTP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          local-dir: ./astra-ciru-child/
          server-dir: /public_html/wp-content/themes/astra-ciru-child/
          dangerous-clean-slate: false  # NO borrar todo antes de subir
          exclude: |
            **/.git*
            **/.DS_Store
            **/node_modules/**

      - name: Deployment summary
        run: |
          echo "✅ Child theme deployed to Hostinger"
          echo "🌐 Site: https://ciru.cloud-ip.cc"
