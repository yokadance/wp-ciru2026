<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Grid</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: sans-serif; padding: 20px; }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 2rem;
            background: #f0f0f0;
        }

        .tabs {
            display: flex;
            gap: 10px;
            margin-bottom: 2rem;
        }

        .tab {
            padding: 10px 20px;
            background: #ddd;
            border: none;
            cursor: pointer;
        }

        .tab.active {
            background: #4CAF50;
            color: white;
        }

        .panel {
            display: none;
            width: 100%;
            max-width: 1280px;
            margin: 0 auto;
            background: yellow;
            padding: 20px;
        }

        .panel.active {
            display: block;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 2rem;
            background: lightblue;
            padding: 10px;
        }

        .card {
            background: white;
            padding: 20px;
            border: 2px solid #333;
            min-height: 200px;
        }
    </style>
</head>
<body>
    <h1>Test: Grid de 3 columnas siempre</h1>
    <p>Los paneles deben tener el MISMO ancho al cambiar tabs</p>

    <div class="container">
        <div class="tabs">
            <button class="tab active" onclick="showTab(1)">3 Cards</button>
            <button class="tab" onclick="showTab(2)">2 Cards</button>
            <button class="tab" onclick="showTab(3)">1 Card</button>
        </div>

        <div class="panel active" id="panel1">
            <div class="grid">
                <div class="card">Card 1</div>
                <div class="card">Card 2</div>
                <div class="card">Card 3</div>
            </div>
        </div>

        <div class="panel" id="panel2">
            <div class="grid">
                <div class="card">Card 1</div>
                <div class="card">Card 2</div>
            </div>
        </div>

        <div class="panel" id="panel3">
            <div class="grid">
                <div class="card">Card 1</div>
            </div>
        </div>
    </div>

    <script>
        function showTab(n) {
            // Ocultar todos los paneles
            document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));

            // Mostrar panel seleccionado
            document.getElementById('panel' + n).classList.add('active');
            document.querySelectorAll('.tab')[n-1].classList.add('active');
        }
    </script>
</body>
</html>
